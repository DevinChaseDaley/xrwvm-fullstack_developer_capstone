name: 'Lint & Format Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write   # needed so the workflow can push fixes

jobs:
  lint_python:
    name: Lint & Format Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so we can commit back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Auto-format with Black
        run: |
          black .
          echo "Formatted Python files with Black"

      - name: Lint & auto-fix with Ruff (where possible)
        run: |
          ruff check . --fix
          echo "Linted Python files with Ruff"

      - name: Commit Python changes (if any)
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: auto-fix Python formatting/lint"
          fi

  lint_js:
    name: Lint & Format JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS tools
        run: |
          npm install --global eslint
          # optionally: npm install --global prettier

      - name: Auto-fix JS with ESLint
        run: |
          # Adjust path/glob to your repo structure
          eslint ./server/database --ext .js --fix || true
          echo "Linted/auto-fixed JavaScript files with ESLint"

      - name: Commit JS changes (if any)
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: auto-fix JS linting"
          fi
